<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SouthCoast Eats</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
<header class="header">
  <button class="menu" aria-label="Menu">☰</button>
  <img src="brand-logo.jpg" alt="SouthCoast Eats — Local Picks. Better Meals." class="logo">
  <button class="search" aria-label="Search">⌕</button>
</header>
<section class="intro"><h1>What sounds good?</h1><p>Find great food around the SouthCoast.</p></section>
<main>
<section class="location">
  <button class="current" id="current" type="button"><span class="loc">➤</span><span><b>Use my current location</b><small id="locationStatus">Find what’s open near you</small></span><i>›</i></button>
  <button class="town-toggle" id="townToggle" type="button"><span class="pin">●</span><b>Search near a town instead</b><i>›</i></button>
  <div class="towns" id="towns" hidden>
    <button type="button">Fall River</button><button type="button">New Bedford</button><button type="button">Dartmouth</button><button type="button">Somerset</button><button type="button">Tiverton</button><button type="button">Westport</button><button type="button">Swansea</button><button type="button">Seekonk</button>
  </div>
  <div class="chosen" id="chosenLocation" hidden></div>
</section>
<section class="food"><h2>I’m craving...</h2><div class="food-grid">
<button type="button" data-food="pizza">🍕<b>Pizza</b></button><button type="button" data-food="american">🍔<b>American</b></button><button type="button" data-food="seafood">🦐<b>Seafood</b></button><button type="button" data-food="italian">🍝<b>Italian</b></button>
<button type="button" data-food="mexican">🌮<b>Mexican</b></button><button type="button" data-food="asian">🥡<b>Asian</b></button><button type="button" data-food="pub">🍺<b>Pub/Burger</b></button><button type="button" data-food="bbq">🔥<b>BBQ</b></button>
<button type="button" data-food="breakfast">🥞<b>Breakfast</b></button><button type="button" data-food="coffee">☕<b>Coffee &amp; Treats</b></button><button type="button" data-food="healthy">🥗<b>Healthy</b></button><button type="button" data-food="dessert">🍰<b>Dessert</b></button>
</div><button class="surprise" id="surprise" type="button">⚄ &nbsp; Surprise Me</button></section>
<section class="how"><h2>How do you want it?</h2><div class="how-grid"><button type="button" data-service="takeout">🚗 <b>Pickup</b></button><button type="button" data-service="delivery">🛵 <b>Delivery</b></button><button type="button" data-service="dine_in">🍴 <b>Dine In</b></button></div></section>
<button class="find" id="find" type="button">FIND MY TONIGHT'S PICK&nbsp; →</button>
<div class="msg" id="msg" aria-live="polite"></div>
<section class="recommendation" id="recommendation" hidden><div class="pick-label">TONIGHT'S PICK</div><h2 id="pickName"></h2><div class="pick-meta" id="pickMeta"></div><p id="pickReason"></p><button class="go" id="go" type="button">LET'S GO&nbsp; →</button><div class="refine"><button type="button" data-refine="closer">Closer</button><button type="button" data-refine="cheaper">Cheaper</button><button type="button" data-refine="different">Different</button><button type="button" data-refine="another">Another</button></div></section>
</main><footer><img src="coastal-footer.jpg" alt="" class="footer-photo"></footer>
</div>
<script>
const state={location:null,town:null,coords:null,accuracy:null,food:null,service:null,lastPick:null,excluded:[]};
const msg=document.getElementById('msg'),chosen=document.getElementById('chosenLocation'),recommendation=document.getElementById('recommendation');
const SUPABASE_URL="https://wyqbqaljjnoqypynosur.supabase.co",SUPABASE_KEY="sb_publishable_mpZ-ZFi_MuLQYcZZh1dnHw_BQo3GGaV";
let records=[],dataReady=false,locationsByRestaurant=new Map();

const townCenters={
 "Fall River":[41.7015,-71.1550],"New Bedford":[41.6362,-70.9342],"Dartmouth":[41.6140,-70.9700],
 "Somerset":[41.7690,-71.1287],"Tiverton":[41.6259,-71.2139],"Westport":[41.6626,-71.0100],
 "Swansea":[41.7482,-71.1890],"Seekonk":[41.8084,-71.3370],"Little Compton":[41.5100,-71.1710]
};

function normalizeFood(value){const v=(value||"").toLowerCase().trim();const map={pizza:"pizza",american:"american",seafood:"seafood",italian:"italian",mexican:"mexican",asian:"asian",pub:"pub","pub/burger":"pub",bbq:"bbq",breakfast:"breakfast",coffee:"coffee","coffee & treats":"coffee",healthy:"healthy",dessert:"dessert"};return map[v]||v.replace(/[^a-z0-9]+/g,"_");}
function normalizeService(value){const v=(value||"").toLowerCase().trim();if(["pickup","takeout","take-out"].includes(v))return "takeout";if(v==="delivery")return "delivery";if(["dine in","dine-in","dine_in","sit-down","sit down"].includes(v))return "dine_in";return v.replace(/[^a-z0-9]+/g,"_");}
function distanceMiles(a,b,c,d){const R=3958.7613,rad=Math.PI/180,dLat=(c-a)*rad,dLon=(d-b)*rad,x=Math.sin(dLat/2)**2+Math.cos(a*rad)*Math.cos(c*rad)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}
function nearestTown(lat,lon){let best=null,bestD=Infinity;for(const [town,[tlat,tlon]] of Object.entries(townCenters)){const d=distanceMiles(lat,lon,tlat,tlon);if(d<bestD){bestD=d;best=town;}}return {town:best,distance:bestD};}
function setLocationLabel(){if(state.town){chosen.hidden=false;chosen.textContent='📍 Searching near '+state.town;return;}if(state.location==='current'){chosen.hidden=false;const n=state.coords?nearestTown(state.coords.lat,state.coords.lon):null;chosen.textContent='📍 Current location • '+(n?n.town:'GPS location')+(state.accuracy?` • ±${Math.round(state.accuracy)} m`:"");return;}chosen.hidden=true;}

async function loadRestaurants(){
 try{
  const fields=["id","name","entity_key","lifecycle_status","data_confidence","quality_signal","price_level","raw_categories","raw_specialization","raw_service"].join(",");
  const headers={apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`};
  const r=await fetch(`${SUPABASE_URL}/rest/v1/restaurants?select=${encodeURIComponent(fields)}&lifecycle_status=eq.active&order=name.asc`,{headers});
  if(!r.ok)throw new Error(`Restaurant load failed (${r.status})`);
  const rows=await r.json();

  const lr=await fetch(`${SUPABASE_URL}/rest/v1/locations?select=restaurant_id,address_line1,address_line2,city,state,postal_code,latitude,longitude,is_primary,active&active=eq.true`,{headers});
  if(!lr.ok)throw new Error(`Location load failed (${lr.status})`);
  const locationRows=await lr.json();
  locationsByRestaurant=new Map();
  for(const x of locationRows){
   if(!x.restaurant_id)continue;
   const existing=locationsByRestaurant.get(x.restaurant_id);
   const hasCoords=x.latitude!=null&&x.longitude!=null;
   if(!existing || (x.is_primary&&!existing.is_primary) || (hasCoords&&! (existing.latitude!=null&&existing.longitude!=null))){
    locationsByRestaurant.set(x.restaurant_id,x);
   }
  }

  records=rows.map(x=>{
   const town=(x.entity_key||"").split("|").slice(1).join("|").trim();
   const rawFood=[x.raw_categories,x.raw_specialization].filter(Boolean).join(";");
   const loc=locationsByRestaurant.get(x.id);
   return{
    id:x.id,name:x.name,town:town.replace(/\b\w/g,c=>c.toUpperCase()),
    food:[...new Set(rawFood.split(/[;,|/]+/).map(normalizeFood).filter(Boolean))],
    services:[...new Set((x.raw_service||"").split(/[;,|]+/).map(normalizeService).filter(Boolean))],
    quality:Number(x.quality_signal)||5,deal:0,price:x.price_level,
    latitude:loc?.latitude!=null?Number(loc.latitude):null,
    longitude:loc?.longitude!=null?Number(loc.longitude):null,
    address:loc?.address_line1||null
   };
  });
  dataReady=true;
  const geoCount=records.filter(r=>r.latitude!=null&&r.longitude!=null).length;
  msg.textContent=`Loaded ${records.length} local restaurants • ${geoCount} with GPS.`;
  setTimeout(()=>{if(msg.textContent.startsWith("Loaded "))msg.textContent=""},2200);
 }catch(err){
  console.error(err);dataReady=false;
  msg.textContent="I couldn't connect to the restaurant database. Please try again.";
 }
}
loadRestaurants();

document.getElementById('current').onclick=()=>{if(!navigator.geolocation){msg.textContent='Location is not available in this browser. Choose a town instead.';return;}document.getElementById('locationStatus').textContent='Getting a fresh GPS location…';msg.textContent='Getting your current location…';navigator.geolocation.getCurrentPosition(pos=>{state.location='current';state.town=null;state.coords={lat:pos.coords.latitude,lon:pos.coords.longitude};state.accuracy=pos.coords.accuracy;const n=nearestTown(state.coords.lat,state.coords.lon);document.getElementById('locationStatus').textContent=`Location ready • ${n.town}`;setLocationLabel();msg.textContent=`Using GPS near ${n.town} (±${Math.round(state.accuracy)} m).`;},err=>{document.getElementById('locationStatus').textContent='Location permission not available';msg.textContent=err.code===2?'Your device could not determine a current location.':err.code===3?'Location lookup timed out. Please try again.':'Choose a town instead, or allow location access in your browser.';},{enableHighAccuracy:true,maximumAge:0,timeout:15000});};

document.getElementById('townToggle').onclick=()=>{const t=document.getElementById('towns');t.hidden=!t.hidden;};
document.querySelectorAll('.towns button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.towns button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');state.town=b.textContent;state.location='town';state.coords=null;state.accuracy=null;setLocationLabel();msg.textContent='Searching near '+state.town+'.';});
document.querySelectorAll('.food-grid button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.food-grid button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');state.food=b.dataset.food;msg.textContent='Looking for '+b.innerText+'…';});
document.getElementById('surprise').onclick=()=>{const a=[...document.querySelectorAll('.food-grid button')];a.forEach(x=>x.classList.remove('sel'));const b=a[Math.floor(Math.random()*a.length)];b.classList.add('sel');state.food=b.dataset.food;msg.textContent='Surprise choice: '+b.innerText+'!';};
document.querySelectorAll('.how-grid button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.how-grid button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');state.service=b.dataset.service;msg.textContent='Service: '+b.innerText+'.';});

function addActualDistances(pool){
 if(state.location!=='current'||!state.coords)return pool;
 for(const r of pool){
  r.distance=(r.latitude!=null&&r.longitude!=null)
   ? distanceMiles(state.coords.lat,state.coords.lon,r.latitude,r.longitude)
   : null;
 }
 return pool;
}

function filterBase(pool){
 if(state.town)pool=pool.filter(r=>r.town.toLowerCase()===state.town.toLowerCase());
 if(state.location==='current'&&state.coords){
  const n=nearestTown(state.coords.lat,state.coords.lon);
  pool=pool.filter(r=>r.town.toLowerCase()===n.town.toLowerCase());
 }
 return pool;
}

function choose(excluded=[]){
 let pool=records.filter(r=>!excluded.includes(r.id));
 pool=filterBase(pool);
 addActualDistances(pool);
 if(state.food)pool=pool.filter(r=>r.food.some(f=>normalizeFood(f)===normalizeFood(state.food)));
 if(state.service)pool=pool.filter(r=>r.services.some(s=>normalizeService(s)===normalizeService(state.service)));

 // Service is a preference, not a hard blocker when it would eliminate every match.
 if(!pool.length&&state.service){
  pool=filterBase(records.filter(r=>!excluded.includes(r.id)));
  addActualDistances(pool);
  if(state.food)pool=pool.filter(r=>r.food.some(f=>normalizeFood(f)===normalizeFood(state.food)));
 }

 pool.sort((a,b)=>{
  if(state.location==='current'){
   // Real restaurant GPS distance is the primary proximity signal.
   // Records without coordinates stay eligible but sort behind geocoded records.
   const ag=a.distance==null, bg=b.distance==null;
   if(ag!==bg)return ag?1:-1;
   if(!ag && Math.abs(a.distance-b.distance)>0.05)return a.distance-b.distance;
   return b.quality-a.quality;
  }
  return (b.quality+b.deal*.15)-(a.quality+a.deal*.15);
 });
 return pool[0];
}

function showPick(pick){if(!pick){recommendation.hidden=true;msg.textContent='I could not find a match for those choices yet. Try removing one refinement.';return;}state.lastPick=pick;recommendation.hidden=false;document.getElementById('pickName').textContent=pick.name;const distance=pick.distance!=null?` • ${pick.distance.toFixed(1)} mi away`:"";document.getElementById('pickMeta').textContent=(pick.town||'SouthCoast')+distance+' • '+(state.service?state.service.replace('_',' '):'flexible service');let reason='Fits what you’re craving';if(state.location==='current')reason+=', near your current location';if(state.service)reason+=', with your preferred service';if(state.town)reason+=', in '+state.town;reason+='.';document.getElementById('pickReason').textContent=reason;recommendation.scrollIntoView({behavior:'smooth',block:'start'});msg.textContent='';}

document.getElementById('find').onclick=()=>{if(!dataReady){msg.textContent='The restaurant database is still loading. Please try again in a moment.';return;}if(!state.location){msg.textContent='First choose your location.';document.querySelector('.location').scrollIntoView({behavior:'smooth'});return;}if(!state.food){msg.textContent='First choose what you’re craving.';document.querySelector('.food').scrollIntoView({behavior:'smooth'});return;}state.excluded=[];showPick(choose());};
document.querySelectorAll('[data-refine]').forEach(b=>b.onclick=()=>{const action=b.dataset.refine;let pick=state.lastPick;if(action==='different'||action==='another'){state.excluded=[...state.excluded,pick?.id].filter(Boolean);pick=choose(state.excluded);}else pick=choose(state.excluded);showPick(pick);});
document.getElementById('go').onclick=()=>{msg.textContent='Great choice! Restaurant action links will be connected next.';};
</script>
</body>
</html>
