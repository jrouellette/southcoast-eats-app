const townEl=document.querySelector("#town");
const townStatus=document.querySelector("#townStatus");
townEl.addEventListener("change",()=>{
  townStatus.textContent="Selected location: "+(townEl.value||"none");
});
document.querySelector("#loc").onclick=()=>{
  if(!navigator.geolocation){alert("Location isn't available on this device.");return}
  navigator.geolocation.getCurrentPosition(pos=>{
    // Keep the user's chosen town if already selected; otherwise use the closest
    // prototype town by a simple geolocation map when coordinates are available.
    alert("Location permission granted. For this prototype, keep your town selected so distance testing stays deterministic.");
  },()=>alert("Location permission was not granted."));
};

function render(list){
  const el=document.querySelector("#results");
  if(!el) return;
  if(!Array.isArray(list) || list.length===0){
    el.innerHTML='<div class="empty"><strong>No recommendations found.</strong><br>Try a larger distance, another food choice, or enable the testing hours option.</div>';
    return;
  }
  el.innerHTML="<h2>Recommendations</h2>"+list.map((r,i)=>{
    const cats=Array.isArray(r.categories)?r.categories.slice(0,5):[];
    return `<div class="result">
      <strong>${i+1}. ${String(r.name||"Restaurant")}</strong>
      <div class="muted">${String(r.town||"")}${r.status==="transition"?" · hours/status need verification":""}</div>
      <div>${cats.map(c=>`<span class="pill">${String(c)}</span>`).join("")}</div>
      ${r.address?`<div class="muted">${String(r.address)}</div>`:""}
    </div>`;
  }).join("");
}

document.querySelector("#find").onclick=()=>{
  const resultsEl=document.querySelector("#results");
  try{
    const food=document.querySelector("#food").value || "";
    const when=document.querySelector("#when").value || "device";
    const allowUnknown=document.querySelector("#unknown").checked;
    const town=townEl.value;

    if(!town){
      resultsEl.innerHTML='<div class="error">Please choose a town first.</div>';
      return;
    }

    const now=new Date();
    let day=["sun","mon","tue","wed","thu","fri","sat"][now.getDay()];
    let mins=now.getHours()*60+now.getMinutes();

    if(when==="morning") mins=8*60;
    if(when==="lunch") mins=12*60;
    if(when==="dinner") mins=19*60;
    if(when==="any") mins=null;

    let candidates=(restaurants.restaurants||[]).filter(r=>{
      if(r.town!==town) return false;
      if(r.status==="closed") return false;
      if(r.status!=="active" && !allowUnknown) return false;
      return true;
    });

    const wanted=(food||"").toLowerCase();

    candidates=candidates.filter(r=>{
      const cats=Array.isArray(r.categories)?r.categories.map(x=>String(x).toLowerCase()):[];
      if(!wanted) return true;
      if(wanted==="breakfast") return cats.includes("breakfast");
      if(wanted==="lunch" || wanted==="dinner") return cats.includes(wanted) || cats.length>0;
      return cats.some(c=>c===wanted || c.includes(wanted) || wanted.includes(c));
    });

    if(mins!==null){
      candidates=candidates.filter(r=>{
        const hours=r.hours && r.hours[day];
        if(!hours){
          return allowUnknown;
        }
        try{
          const a=String(hours[0]).split(":").map(Number);
          const b=String(hours[1]).split(":").map(Number);
          const open=a[0]*60+a[1], close=b[0]*60+b[1];
          if(mins<open || mins>close) return false;

          if(wanted==="breakfast"){
            const bp=r.mealPeriods && r.mealPeriods.breakfast && r.mealPeriods.breakfast[day];
            if(!bp) return allowUnknown;
            const ba=String(bp[0]).split(":").map(Number);
            const bb=String(bp[1]).split(":").map(Number);
            const bs=ba[0]*60+ba[1], be=bb[0]*60+bb[1];
            if(mins<bs || mins>be) return false;
          }
          return true;
        }catch(e){
          return allowUnknown;
        }
      });
    }

    candidates.sort((a,b)=>{
      const ac=Array.isArray(a.categories)?a.categories.map(x=>String(x).toLowerCase()):[];
      const bc=Array.isArray(b.categories)?b.categories.map(x=>String(x).toLowerCase()):[];
      const am=wanted && ac.includes(wanted)?30:0;
      const bm=wanted && bc.includes(wanted)?30:0;
      return bm-am;
    });

    render(candidates.slice(0,10));
  }catch(e){
    console.error(e);
    resultsEl.innerHTML='<div class="error"><strong>Test error:</strong> '+String(e.message||e)+'</div>';
  }
};</script>
