<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SouthCoast Eats — V2 Consumer Test</title>
</head>
<body>
<script>
(async()=>{
  const BASE='https://raw.githubusercontent.com/jrouellette/southcoast-eats-app/37d991a9b1d52a2e7b7b046d05f4feb9ff49e243/index.html';
  try{
    const r=await fetch(BASE,{cache:'no-store'});
    if(!r.ok)throw new Error('Baseline fetch failed: '+r.status);
    let html=await r.text();

    // V2 service-filter baseline fixes. The pinned source is the verified UI that was
    // tested before the regression; these replacements remove service fallbacks in
    // recommendation, Surprise Me, and Cheaper refinement paths.
    html=html.replace(
      'if(!pool.length&&state.service&&state.service!=="drive_thru"){',
      'if(!pool.length&&state.service){return null}\n  if(false){'
    );
    html=html.replace(
      'return filterBase(records).some(r=>r.food.includes(normalizeFood(food))&&(!state.service||r.services.includes(normalizeService(state.service))||state.service!=="drive_thru"));',
      'return filterBase(records).some(r=>r.food.includes(normalizeFood(food))&&(!state.service||r.services.includes(normalizeService(state.service))));'
    );
    html=html.replace(
      '&&(!state.food||r.food.includes(normalizeFood(state.food)))&&(!state.town||r.town.toLowerCase()===state.town.toLowerCase())&&r.price!=null',
      '&&(!state.food||r.food.includes(normalizeFood(state.food)))&&(!state.service||r.services.includes(normalizeService(state.service)))&&(!state.town||r.town.toLowerCase()===state.town.toLowerCase())&&r.price!=null'
    );

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<p style="font-family:Arial;padding:24px;color:#0b315d">SouthCoast Eats could not load the pinned V2 UI baseline. Please check the network connection and try again.</p>';
    console.error(e);
  }
})();
</script>
</body>
</html>
