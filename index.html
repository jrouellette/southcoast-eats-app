<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SouthCoast Eats</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <button class="nav-icon" aria-label="Menu">☰</button>
    <img src="brand-header.jpg" class="brand" alt="SouthCoast Eats — Local Picks. Better Meals.">
    <button class="search-icon" aria-label="Search">⌕</button>
  </header>

  <section class="hero">
    <img src="coastal-hero.jpg" alt="" class="hero-art">
    <div class="hero-copy">
      <h1>What sounds good?</h1>
      <p>Find great food around the SouthCoast.</p>
    </div>
  </section>

  <main>
    <section class="location">
      <button class="current" id="current">
        <span class="loc-symbol">➤</span>
        <span><strong>Use my current location</strong><small>Find what’s open near you</small></span>
        <b>›</b>
      </button>
      <button class="town-toggle" id="town-toggle" aria-expanded="true">
        <span class="pin">●</span><strong>Search near a town instead</strong><b>›</b>
      </button>
      <div class="towns" id="towns">
        <button>Fall River</button><button>New Bedford</button><button>Dartmouth</button>
        <button>Somerset</button><button>Tiverton</button>
        <button>Westport</button><button>Swansea</button><button>Seekonk</button><button>Bristol</button>
      </div>
    </section>

    <section class="food">
      <h2>I’m craving...</h2>
      <div class="food-grid">
        <button class="food-card"><span>🍕</span><strong>Pizza</strong></button>
        <button class="food-card"><span>🍔</span><strong>American</strong></button>
        <button class="food-card"><span>🦐</span><strong>Seafood</strong></button>
        <button class="food-card"><span>🍝</span><strong>Italian</strong></button>
        <button class="food-card"><span>🌮</span><strong>Mexican</strong></button>
        <button class="food-card"><span>🥡</span><strong>Asian</strong></button>
        <button class="food-card"><span>🍺</span><strong>Pub/Burger</strong></button>
        <button class="food-card"><span>🔥</span><strong>BBQ</strong></button>
        <button class="food-card"><span>🥞</span><strong>Breakfast</strong></button>
        <button class="food-card"><span>☕</span><strong>Coffee &amp; Treats</strong></button>
        <button class="food-card"><span>🥗</span><strong>Healthy</strong></button>
        <button class="food-card"><span>🍰</span><strong>Dessert</strong></button>
      </div>

      <button class="surprise" id="surprise"><span>⚄</span> Surprise Me</button>
    </section>

    <section class="how">
      <h2>How do you want it?</h2>
      <div class="how-grid">
        <button class="how-card selected"><span>🚗</span><strong>Pickup</strong></button>
        <button class="how-card"><span>🛵</span><strong>Delivery</strong></button>
        <button class="how-card"><span>🍴</span><strong>Dine In</strong></button>
      </div>
    </section>

    <button class="find" id="find">FIND MY TONIGHT'S PICK <span>→</span></button>
    <div class="message" id="message" aria-live="polite"></div>
  </main>

  <footer>
    <img src="coastal-footer.jpg" alt="" class="footer-art">
    <div class="footer-copy">
      <div class="anchor">⚓</div>
      <div>FALL RIVER&nbsp;&nbsp; • &nbsp;&nbsp;NEW BEDFORD&nbsp;&nbsp; • &nbsp;&nbsp;SOMERSET&nbsp;&nbsp; • &nbsp;&nbsp;TIVERTON</div>
      <div>DARTMOUTH&nbsp;&nbsp; • &nbsp;&nbsp;SEEKONK&nbsp;&nbsp; • &nbsp;&nbsp;SWANSEA&nbsp;&nbsp; • &nbsp;&nbsp;WESTPORT&nbsp;&nbsp; • &nbsp;&nbsp;BRISTOL</div>
    </div>
  </footer>
</div>

<script>
const toggle = document.getElementById('town-toggle');
const towns = document.getElementById('towns');
toggle.addEventListener('click', () => {
  towns.hidden = !towns.hidden;
  toggle.setAttribute('aria-expanded', String(!towns.hidden));
});
document.querySelectorAll('.towns button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.towns button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
}));
document.getElementById('current').addEventListener('click', () => {
  document.getElementById('message').textContent = 'Using your current location.';
});
document.querySelectorAll('.food-card').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.food-card').forEach(x => x.classList.remove('selected'));
  b.classList.add('selected');
}));
document.getElementById('surprise').addEventListener('click', () => {
  const cards = [...document.querySelectorAll('.food-card')];
  const pick = cards[Math.floor(Math.random()*cards.length)];
  cards.forEach(x => x.classList.remove('selected'));
  pick.classList.add('selected');
});
document.querySelectorAll('.how-card').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.how-card').forEach(x => x.classList.remove('selected'));
  b.classList.add('selected');
}));
document.getElementById('find').addEventListener('click', () => {
  document.getElementById('message').textContent = 'Recommendation flow coming next.';
});
</script>
</body>
</html>
