<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SouthCoast Eats</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
<header class="header">
  <button class="menu" aria-label="Menu">☰</button>
  <img src="brand-logo.jpg" alt="SouthCoast Eats — Local Picks. Better Meals." class="logo">
  <button class="search" aria-label="Search">⌕</button>
</header>
<section class="intro">
  <h1>What sounds good?</h1>
  <p>Find great food around the SouthCoast.</p>
</section>
<main>
<section class="location">
  <button class="current" id="current" type="button">
    <span class="loc">➤</span>
    <span><b>Use my current location</b><small id="locationStatus">Find what’s open near you</small></span>
    <i>›</i>
  </button>
  <button class="town-toggle" id="townToggle" type="button">
    <span class="pin">●</span><b>Search near a town instead</b><i>›</i>
  </button>
  <div class="towns" id="towns" hidden>
    <button type="button">Fall River</button><button type="button">New Bedford</button><button type="button">Dartmouth</button><button type="button">Somerset</button><button type="button">Tiverton</button>
    <button type="button">Westport</button><button type="button">Swansea</button><button type="button">Seekonk</button>
  </div>
  <div class="chosen" id="chosenLocation" hidden></div>
</section>

<section class="food">
<h2>I’m craving...</h2>
<div class="food-grid">
<button type="button" data-food="pizza">🍕<b>Pizza</b></button><button type="button" data-food="american">🍔<b>American</b></button><button type="button" data-food="seafood">🦐<b>Seafood</b></button><button type="button" data-food="italian">🍝<b>Italian</b></button>
<button type="button" data-food="mexican">🌮<b>Mexican</b></button><button type="button" data-food="asian">🥡<b>Asian</b></button><button type="button" data-food="pub">🍺<b>Pub/Burger</b></button><button type="button" data-food="bbq">🔥<b>BBQ</b></button>
<button type="button" data-food="breakfast">🥞<b>Breakfast</b></button><button type="button" data-food="coffee">☕<b>Coffee &amp; Treats</b></button><button type="button" data-food="healthy">🥗<b>Healthy</b></button><button type="button" data-food="dessert">🍰<b>Dessert</b></button>
</div>
<button class="surprise" id="surprise" type="button">⚄ &nbsp; Surprise Me</button>
</section>

<section class="how">
<h2>How do you want it?</h2>
<div class="how-grid">
<button type="button" data-service="takeout">🚗 <b>Pickup</b></button>
<button type="button" data-service="delivery">🛵 <b>Delivery</b></button>
<button type="button" data-service="dine_in">🍴 <b>Dine In</b></button>
</div>
</section>

<button class="find" id="find" type="button">FIND MY TONIGHT'S PICK&nbsp; →</button>
<div class="msg" id="msg" aria-live="polite"></div>

<section class="recommendation" id="recommendation" hidden>
  <div class="pick-label">TONIGHT'S PICK</div>
  <h2 id="pickName"></h2>
  <div class="pick-meta" id="pickMeta"></div>
  <p id="pickReason"></p>
  <button class="go" id="go" type="button">LET'S GO&nbsp; →</button>
  <div class="refine">
    <button type="button" data-refine="closer">Closer</button>
    <button type="button" data-refine="cheaper">Cheaper</button>
    <button type="button" data-refine="different">Different</button>
    <button type="button" data-refine="another">Another</button>
  </div>
</section>
</main>
<footer><img src="coastal-footer.jpg" alt="" class="footer-photo"></footer>
</div>

<script>
const state={location:null,town:null,coords:null,food:null,service:null,lastPick:null,excluded:[]};
const msg=document.getElementById('msg');
const chosen=document.getElementById('chosenLocation');
const recommendation=document.getElementById('recommendation');

const records=[
 {name:"Domino's Pizza",town:"Fall River",food:["pizza"],services:["takeout","delivery"],quality:7.5,deal:5},
 {name:"Highland Pizza",town:"Fall River",food:["pizza"],services:["takeout","dine_in"],quality:7.5,deal:5},
 {name:"Minerva's III Pizzeria",town:"Fall River",food:["pizza"],services:["takeout","dine_in"],quality:7.5,deal:5},
 {name:"Papa John's",town:"Fall River",food:["pizza"],services:["takeout","delivery"],quality:7.5,deal:5},
 {name:"110 Grill",town:"Fall River",food:["american","chicken","seafood","pub"],services:["takeout","dine_in"],quality:7.5,deal:5},
 {name:"Scottie's Pub",town:"Fall River",food:["pub","american"],services:["takeout","dine_in","delivery"],quality:7.8,deal:7},
 {name:"Fiesta Mexican Restaurant",town:"Fall River",food:["mexican"],services:["takeout","dine_in"],quality:7.8,deal:6.5},
 {name:"Fiesta Taqueria",town:"Fall River",food:["mexican"],services:["takeout","delivery"],quality:7.5,deal:7},
 {name:"Al Mac's Diner",town:"Fall River",food:["breakfast","american"],services:["takeout","dine_in"],quality:7.5,deal:5},
 {name:"Dunkin'",town:"Fall River",food:["breakfast","coffee"],services:["takeout","delivery"],quality:7.4,deal:7.9},
 {name:"Ed's Famous BBQ",town:"Fall River",food:["bbq","chicken"],services:["takeout","dine_in"],quality:7.5,deal:5},
 {name:"China Star",town:"Fall River",food:["asian","chicken","seafood"],services:["takeout"],quality:7.5,deal:5},
 {name:"Caravela Restaurant",town:"Fall River",food:["seafood"],services:["takeout","dine_in"],quality:7.5,deal:5},
 {name:"Classic Pizza",town:"Tiverton",food:["pizza"],services:["takeout"],quality:7.5,deal:5},
 {name:"Domino's Pizza",town:"Tiverton",food:["pizza"],services:["takeout","delivery"],quality:7.5,deal:5},
 {name:"Mediterranean Pizza",town:"Tiverton",food:["pizza"],services:["takeout","dine_in"],quality:8.4,deal:8},
 {name:"Asian Gourmet",town:"Tiverton",food:["asian","chicken"],services:["takeout","dine_in"],quality:7.5,deal:5},
 {name:"Boat House Waterfront Dining",town:"Tiverton",food:["seafood","chicken"],services:["takeout","dine_in"],quality:7.5,deal:5}
];

function setLocationLabel(){
  if(state.town){chosen.hidden=false;chosen.textContent='📍 Searching near '+state.town;return;}
  if(state.location==='current'){chosen.hidden=false;chosen.textContent='📍 Using your current location';return;}
  chosen.hidden=true;
}

document.getElementById('current').onclick=()=>{
  if(!navigator.geolocation){
    state.location='current';
    document.getElementById('locationStatus').textContent='Location unavailable in this browser';
    setLocationLabel();
    return;
  }
  document.getElementById('locationStatus').textContent='Requesting your location…';
  navigator.geolocation.getCurrentPosition(pos=>{
    state.location='current';state.coords={lat:pos.coords.latitude,lon:pos.coords.longitude};state.town=null;
    document.getElementById('locationStatus').textContent='Location ready';
    setLocationLabel();msg.textContent='Current location is ready.';
  },()=>{
    document.getElementById('locationStatus').textContent='Location permission not available';
    msg.textContent='Choose a town instead, or allow location access in your browser.';
  });
};

document.getElementById('townToggle').onclick=()=>{
  const t=document.getElementById('towns'); t.hidden=!t.hidden;
};

document.querySelectorAll('.towns button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.towns button').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel');
  state.town=b.textContent;state.location='town';
  setLocationLabel();msg.textContent='Searching near '+state.town+'.';
});

document.querySelectorAll('.food-grid button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.food-grid button').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel');state.food=b.dataset.food;
  msg.textContent='Looking for '+b.innerText+'…';
});

document.getElementById('surprise').onclick=()=>{
  const a=[...document.querySelectorAll('.food-grid button')];
  a.forEach(x=>x.classList.remove('sel'));
  const b=a[Math.floor(Math.random()*a.length)];
  b.classList.add('sel');state.food=b.dataset.food;
  msg.textContent='Surprise choice: '+b.innerText+'!';
};

document.querySelectorAll('.how-grid button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.how-grid button').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel');state.service=b.dataset.service;
  msg.textContent='Service: '+b.innerText+'.';
});

function choose(excluded=[]){
  let pool=records.filter(r=>!excluded.includes(r.name));
  if(state.town)pool=pool.filter(r=>r.town===state.town);
  if(state.food)pool=pool.filter(r=>r.food.includes(state.food));
  if(state.service)pool=pool.filter(r=>r.services.includes(state.service));
  if(!pool.length && state.service){
    pool=records.filter(r=>!excluded.includes(r.name));
    if(state.town)pool=pool.filter(r=>r.town===state.town);
    if(state.food)pool=pool.filter(r=>r.food.includes(state.food));
  }
  pool.sort((a,b)=>(b.quality+b.deal*.15)-(a.quality+a.deal*.15));
  return pool[0];
}

function showPick(pick){
  if(!pick){
    recommendation.hidden=true;
    msg.textContent='I could not find a match for those choices yet. Try removing one refinement.';
    return;
  }
  state.lastPick=pick;
  recommendation.hidden=false;
  document.getElementById('pickName').textContent=pick.name;
  document.getElementById('pickMeta').textContent=pick.town+'  •  '+(state.service?state.service.replace('_',' '):'flexible service');
  let reason='Fits what you’re craving';
  if(state.service)reason+=', offers your preferred service';
  if(state.town)reason+=', and is in '+state.town;
  reason+='.';
  document.getElementById('pickReason').textContent=reason;
  recommendation.scrollIntoView({behavior:'smooth',block:'start'});
  msg.textContent='';
}

document.getElementById('find').onclick=()=>{
  if(!state.location){
    msg.textContent='First choose your location.';
    document.querySelector('.location').scrollIntoView({behavior:'smooth'});
    return;
  }
  if(!state.food){
    msg.textContent='First choose what you’re craving.';
    document.querySelector('.food').scrollIntoView({behavior:'smooth'});
    return;
  }
  state.excluded=[];showPick(choose());
};

document.querySelectorAll('[data-refine]').forEach(b=>b.onclick=()=>{
  const action=b.dataset.refine;
  let pick=state.lastPick;
  if(action==='different'||action==='another'){
    state.excluded=[...state.excluded,pick?.name].filter(Boolean);
    pick=choose(state.excluded);
  }else{
    pick=choose(state.excluded);
  }
  showPick(pick);
});

document.getElementById('go').onclick=()=>{
  msg.textContent='Great choice! Restaurant action links will be connected next.';
};
</script>
</body>
</html>
