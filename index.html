<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SouthCoast Eats — V2 Consumer Test</title>
<style>
:root{--navy:#0b315d;--teal:#1599a2;--sky:#e8f7fc;--paper:#fbfeff;--line:#dcebf2;--accent:#1769a0}
*{box-sizing:border-box}body{margin:0;background:#dfe9ee;color:var(--navy);font-family:Arial,"Trebuchet MS",sans-serif}.app{width:min(100%,900px);margin:auto;background:var(--paper);min-height:100vh;overflow:hidden}.header{height:160px;background:#eaf8fd;display:grid;grid-template-columns:90px 1fr 90px;align-items:center;padding:8px 24px}.menu,.search{border:0;background:none;color:var(--navy);cursor:pointer;font-size:47px}.search{font-size:62px}.logo{width:min(500px,100%);height:145px;object-fit:contain;margin:auto}.intro{text-align:center;padding:24px 18px 18px;background:linear-gradient(#eaf8fd,#fbfeff)}.intro h1{margin:0;font-size:42px;letter-spacing:-1.2px}.intro p{margin:6px 0 0;font-size:24px}.location,.food,.how{padding:0 48px}.location{margin-top:2px}.current,.town-toggle{width:100%;display:grid;grid-template-columns:58px 1fr 30px;align-items:center;border:0;border-radius:22px;text-align:left;cursor:pointer}.current{background:#159aa3;color:#fff;padding:18px 25px}.current b,.current small{display:block}.current b{font-size:24px}.current small{font-size:18px;margin-top:2px}.current i,.town-toggle i{font-style:normal;font-size:42px}.loc{font-size:39px;transform:rotate(-45deg)}.town-toggle{margin-top:9px;background:#e1f3fa;padding:17px 25px}.town-toggle b{font-size:21px}.pin{font-size:18px}.towns{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;padding-top:9px}.towns button{border:0;background:#e6f4fa;border-radius:18px;padding:10px 23px;font-size:17px}.towns button.sel{background:#cdebf1;font-weight:bold}.food{margin-top:24px}.food h2,.how h2{margin:0 0 13px;font-size:31px}.food-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.food-grid button{height:111px;border:1px solid var(--line);border-radius:17px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;box-shadow:0 5px 14px #195b7d17;cursor:pointer;font-size:43px}.food-grid b{font-size:19px}.food-grid button.sel{outline:2px solid #2aabb0}.surprise{display:block;margin:21px auto 0;border:0;border-radius:34px;background:#1769a0;color:#fff;padding:13px 35px;font-size:24px;font-weight:bold;cursor:pointer}.how{margin-top:24px}.how-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.how-grid button{height:78px;border:1px solid var(--line);background:#fff;border-radius:17px;box-shadow:0 5px 14px #195b7d17;font-size:28px;cursor:pointer}.how-grid b{font-size:19px}.how-grid button.sel{border-color:#2aa6a6!important;box-shadow:0 0 0 2px rgba(42,166,166,.18)!important}.find{display:block;width:calc(100% - 96px);height:62px;margin:24px 48px 0;border:0;border-radius:15px;background:var(--navy);color:#fff;font-size:15px;letter-spacing:1.3px;font-weight:bold;cursor:pointer}.msg{width:100%;max-width:100%;box-sizing:border-box;padding:8px 12px 0;text-align:center;line-height:1.35;overflow-wrap:anywhere;color:var(--teal);min-height:28px}.chosen{margin:8px 4px 0;color:var(--teal);font-size:14px;font-weight:bold}.recommendation{margin:18px 48px 0;padding:26px;border-radius:24px;background:linear-gradient(145deg,#e9f8fb,#fff);border:1px solid var(--line);box-shadow:0 8px 24px #195b7d18}.pick-label{color:var(--teal);font-size:14px;font-weight:bold;letter-spacing:1.4px}.recommendation h2{font-size:34px;margin:8px 0}.pick-meta{font-size:16px;font-weight:bold}.recommendation p{font-size:18px;line-height:1.45}.go{border:0;border-radius:13px;background:var(--navy);color:#fff;padding:13px 22px;font-weight:bold;cursor:pointer}.refine{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}.refine button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 5px;cursor:pointer;color:var(--navy)}footer{height:180px;margin-top:20px;overflow:hidden}footer .footer-photo{width:100%;height:100%;object-fit:cover;display:block}
@media(max-width:600px){.header{height:105px;grid-template-columns:44px 1fr 44px;padding:5px 10px}.menu{font-size:30px}.search{font-size:40px}.logo{height:95px}.intro{padding:15px 12px 12px}.intro h1{font-size:27px}.intro p{font-size:16px;margin-top:3px}.location,.food,.how{padding-left:18px;padding-right:18px}.current,.town-toggle{grid-template-columns:38px 1fr 22px;padding:8px 13px;border-radius:14px}.current b{font-size:15px}.current small{font-size:11px}.current i,.town-toggle i{font-size:26px}.town-toggle b{font-size:13px}.towns{gap:6px}.towns button{font-size:12px;padding:8px 12px}.food{margin-top:15px}.food h2,.how h2{font-size:23px;margin-bottom:9px}.food-grid{gap:6px}.food-grid button{height:70px;border-radius:12px;font-size:25px}.food-grid b{font-size:10.5px;line-height:1.05;text-align:center}.surprise{font-size:17px;padding:8px 24px;margin-top:10px}.how{margin-top:14px}.how-grid{gap:7px}.how-grid button{height:55px;font-size:20px}.how-grid b{font-size:12px}.find{width:calc(100% - 36px);margin-left:18px;margin-right:18px;height:49px;margin-top:15px;font-size:11px}.msg{min-height:18px;padding-top:5px}.recommendation{margin:20px 18px 0;padding:20px;border-radius:19px}.recommendation h2{font-size:28px}.recommendation p{font-size:15px}.refine{gap:6px}.refine button{font-size:12px;padding:8px 2px}footer{height:145px;margin-top:14px}}
</style>
</head>
<body>
<div class="app">
<header class="header"><button class="menu" aria-label="Menu">☰</button><img src="https://raw.githubusercontent.com/jrouellette/southcoast-eats-app/main/brand-logo.jpg" alt="SouthCoast Eats — Local Picks. Better Meals." class="logo"><button class="search" aria-label="Search">⌕</button></header>
<section class="intro"><h1>What sounds good?</h1><p>Find great food around the SouthCoast.</p></section>
<main>
<section class="location"><button class="current" id="current" type="button"><span class="loc">➤</span><span><b>Use my current location</b><small id="locationStatus">Find what’s open near you</small></span><i>›</i></button><button class="town-toggle" id="townToggle" type="button"><span class="pin">●</span><b>Search near a town instead</b><i>›</i></button><div class="towns" id="towns" hidden><button type="button">Fall River</button><button type="button">New Bedford</button><button type="button">Dartmouth</button><button type="button">Somerset</button><button type="button">Tiverton</button><button type="button">Westport</button><button type="button">Swansea</button><button type="button">Seekonk</button><button type="button">Little Compton</button></div><div class="chosen" id="chosenLocation" hidden></div></section>
<section class="food"><h2>I’m craving...</h2><div class="food-grid"><button type="button" data-food="pizza">🍕<b>Pizza</b></button><button type="button" data-food="portuguese">🇵🇹<b>Portuguese</b></button><button type="button" data-food="seafood">🦐<b>Seafood</b></button><button type="button" data-food="italian">🍝<b>Italian</b></button><button type="button" data-food="mexican">🌮<b>Mexican</b></button><button type="button" data-food="asian">🥡<b>Asian</b></button><button type="button" data-food="pub">🍺<b>Pub/Burger</b></button><button type="button" data-food="bbq">🔥<b>BBQ</b></button><button type="button" data-food="breakfast">🥞<b>Breakfast</b></button><button type="button" data-food="coffee">☕<b>Coffee &amp; Treats</b></button><button type="button" data-food="healthy">🥗<b>Healthy</b></button><button type="button" data-food="dessert">🍰<b>Dessert</b></button></div><button class="surprise" id="surprise" type="button">⚄ &nbsp; Surprise Me</button></section>
<section class="how"><h2>How do you want it?</h2><div class="how-grid"><button type="button" data-service="takeout">🚗 <b>Pickup</b></button><button type="button" data-service="delivery">🛵 <b>Delivery</b></button><button type="button" data-service="dine_in">🍴 <b>Dine In</b></button><button type="button" data-service="drive_thru">🚘 <b>Drive-Thru</b></button></div></section>
<button class="find" id="find" type="button">FIND MY TONIGHT'S PICK&nbsp; →</button><div class="msg" id="msg" aria-live="polite"></div>
<section class="recommendation" id="recommendation" hidden><div class="pick-label">TONIGHT'S PICK</div><h2 id="pickName"></h2><div class="pick-meta" id="pickMeta"></div><p id="pickReason"></p><button class="go" id="go" type="button">LET'S GO&nbsp; →</button><div class="refine"><button type="button" data-refine="closer">Closer</button><button type="button" data-refine="cheaper">Cheaper</button><button type="button" data-refine="different">Different</button><button type="button" data-refine="another">Another</button></div></section>
</main><footer><img src="https://raw.githubusercontent.com/jrouellette/southcoast-eats-app/main/coastal-footer.jpg" alt="" class="footer-photo"></footer></div>
<script>
const state={location:null,town:null,coords:null,accuracy:null,food:null,service:null,lastPick:null,excluded:[]};
const msg=document.getElementById('msg'),chosen=document.getElementById('chosenLocation'),recommendation=document.getElementById('recommendation');
const SUPABASE_URL="https://wyqbqaljjnoqypynosur.supabase.co",SUPABASE_KEY="sb_publishable_mpZ-ZFi_MuLQYcZZh1dnHw_BQo3GGaV";let records=[],dataReady=false;
const townCenters={"Fall River":[41.7015,-71.1550],"New Bedford":[41.6362,-70.9342],"Dartmouth":[41.6140,-70.9700],"Somerset":[41.7690,-71.1287],"Tiverton":[41.6259,-71.2139],"Westport":[41.6626,-71.0100],"Swansea":[41.7482,-71.1890],"Seekonk":[41.8084,-71.3370],"Little Compton":[41.5100,-71.1710]};
function normalizeFood(value){const v=(value||"").toLowerCase().trim();if(["asian","chinese","korean","thai","japanese","vietnamese","indonesian","filipino","pan-asian","pan asian"].includes(v))return "asian";const map={pizza:"pizza",portuguese:"portuguese",american:"american",seafood:"seafood",italian:"italian",mexican:"mexican",pub:"pub","pub/burger":"pub",bbq:"bbq",breakfast:"breakfast",coffee:"coffee","coffee & treats":"coffee",cafe:"coffee",bakery:"coffee","coffee shop":"coffee",healthy:"healthy",dessert:"dessert"};return map[v]||v.replace(/[^a-z0-9]+/g,"_")}
function normalizeService(value){const v=(value||"").toLowerCase().trim();if(["pickup","takeout","take-out"].includes(v))return "takeout";if(v==="delivery")return "delivery";if(["dine in","dine-in","dine_in","sit-down","sit down"].includes(v))return "dine_in";if(["drive thru","drive-thru","drive_thru","drive through"].includes(v))return "drive_thru";return v.replace(/[^a-z0-9]+/g,"_")}
function distanceMiles(a,b,c,d){const R=3958.7613,rad=Math.PI/180,dLat=(c-a)*rad,dLon=(d-b)*rad,x=Math.sin(dLat/2)**2+Math.cos(a*rad)*Math.cos(c*rad)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function nearestTown(lat,lon){let best=null,bestD=Infinity;for(const [town,[tlat,tlon]] of Object.entries(townCenters)){const d=distanceMiles(lat,lon,tlat,tlon);if(d<bestD){bestD=d;best=town}}return{town:best,distance:bestD}}
function setLocationLabel(){if(state.town){chosen.hidden=false;chosen.textContent='📍 Searching near '+state.town;return}if(state.location==='current'){chosen.hidden=false;const n=state.coords?nearestTown(state.coords.lat,state.coords.lon):null;chosen.textContent='📍 Current location • '+(n?n.town:'GPS location')+(state.accuracy?` • ±${Math.round(state.accuracy)} m`:"");return}chosen.hidden=true}
async function loadRestaurants(){try{const fields=["restaurant_id","restaurant_key","restaurant_name","slug","address_line_1","address_line_2","city","state","postal_code","latitude","longitude","phone","website_url","primary_food_type","food_types","service_types","meal_types","audience_types","features","price_level","is_delivery_available","is_takeout_available","is_pickup_available","is_dine_in_available","is_drive_through_available","regular_hours","meal_period_hours","hours_status","last_verified_at","updated_at"].join(",");const headers={apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`};const r=await fetch(`${SUPABASE_URL}/rest/v1/consumer_restaurants_v2?select=${encodeURIComponent(fields)}&order=restaurant_name.asc`,{headers});if(!r.ok)throw new Error(`Consumer view load failed (${r.status})`);const rows=await r.json();records=rows.map(x=>{const foods=Array.isArray(x.food_types)?[...x.food_types]:[];if(x.primary_food_type)foods.push(x.primary_food_type);const services=Array.isArray(x.service_types)?[...x.service_types]:[];if(x.is_delivery_available===true)services.push('delivery');if(x.is_takeout_available===true||x.is_pickup_available===true)services.push('takeout');if(x.is_dine_in_available===true)services.push('dine_in');if(x.is_drive_through_available===true)services.push('drive_thru');return{id:x.restaurant_id,key:x.restaurant_key,name:x.restaurant_name,town:(x.city||'').replace(/\b\w/g,c=>c.toUpperCase()),food:[...new Set(foods.map(normalizeFood).filter(Boolean))],services:[...new Set(services.map(normalizeService).filter(Boolean))],price:x.price_level||null,latitude:x.latitude!=null?Number(x.latitude):null,longitude:x.longitude!=null?Number(x.longitude):null,address:[x.address_line_1,x.address_line_2,x.city,x.state,x.postal_code].filter(Boolean).join(', ')||null,phone:x.phone||null,website:x.website_url||null,mealTypes:Array.isArray(x.meal_types)?x.meal_types:[],audienceTypes:Array.isArray(x.audience_types)?x.audience_types:[],features:Array.isArray(x.features)?x.features:[],regularHours:x.regular_hours||null,mealPeriodHours:x.meal_period_hours||null,hoursStatus:x.hours_status||'unknown',lastVerifiedAt:x.last_verified_at||null}});dataReady=true;const geoCount=records.filter(r=>r.latitude!=null&&r.longitude!=null).length;msg.textContent=`Loaded ${records.length} local restaurants • ${geoCount} with GPS.`;setTimeout(()=>{if(msg.textContent.startsWith('Loaded '))msg.textContent=''},2200)}catch(err){console.error(err);dataReady=false;msg.textContent="I couldn't connect to the restaurant database. Please try again."}}
loadRestaurants();
document.getElementById('current').onclick=()=>{if(!navigator.geolocation){msg.textContent='Location is not available in this browser. Choose a town instead.';return}document.getElementById('locationStatus').textContent='Getting a fresh GPS location…';msg.textContent='Getting your current location…';navigator.geolocation.getCurrentPosition(pos=>{state.location='current';state.town=null;state.coords={lat:pos.coords.latitude,lon:pos.coords.longitude};state.accuracy=pos.coords.accuracy;const n=nearestTown(state.coords.lat,state.coords.lon);document.getElementById('locationStatus').textContent=`Location ready • ${n.town}`;setLocationLabel();msg.textContent=`Using GPS near ${n.town} (±${Math.round(state.accuracy)} m).`},err=>{document.getElementById('locationStatus').textContent='Location permission not available';msg.textContent=err.code===2?'Your device could not determine a current location.':err.code===3?'Location lookup timed out.':'Choose a town instead, or allow location access in your browser.'},{enableHighAccuracy:true,maximumAge:0,timeout:15000})};
document.getElementById('townToggle').onclick=()=>{const t=document.getElementById('towns');t.hidden=!t.hidden};document.querySelectorAll('.towns button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.towns button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');state.town=b.textContent;state.location='town';state.coords=null;state.accuracy=null;setLocationLabel();msg.textContent='Searching near '+state.town+'.'});document.querySelectorAll('.food-grid button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.food-grid button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');state.food=b.dataset.food;msg.textContent='Looking for '+b.innerText+'…'});document.getElementById('surprise').onclick=()=>{const candidates=[...document.querySelectorAll('.food-grid button')].filter(b=>{if(!state.service)return true;const food=normalizeFood(b.dataset.food);return records.some(r=>r.food.includes(food)&&r.services.includes(normalizeService(state.service))&&(!state.town||r.town.toLowerCase()===state.town.toLowerCase()))});if(!candidates.length){msg.textContent='No Surprise Me option matches the selected service here yet.';return}candidates.forEach(x=>x.classList.remove('sel'));const b=candidates[Math.floor(Math.random()*candidates.length)];b.classList.add('sel');state.food=b.dataset.food;msg.textContent='Surprise choice: '+b.innerText+'!'};document.querySelectorAll('.how-grid button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.how-grid button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');state.service=b.dataset.service;msg.textContent='Service: '+b.innerText+'.'});
function filterBase(pool){if(state.town)return pool.filter(r=>r.town.toLowerCase()===state.town.toLowerCase());if(state.location==='current'&&state.coords){const n=nearestTown(state.coords.lat,state.coords.lon);return pool.filter(r=>r.town.toLowerCase()===n.town.toLowerCase())}return pool}
function choose(excluded=[]){let pool=filterBase(records.filter(r=>!excluded.includes(r.id)));if(state.location==='current'&&state.coords)for(const r of pool)r.distance=r.latitude!=null&&r.longitude!=null?distanceMiles(state.coords.lat,state.coords.lon,r.latitude,r.longitude):null;if(state.food)pool=pool.filter(r=>r.food.includes(normalizeFood(state.food)));if(state.service)pool=pool.filter(r=>r.services.includes(normalizeService(state.service)));if(!pool.length&&state.service){return null}pool.sort((a,b)=>{if(state.location==='current'){const ag=a.distance==null,bg=b.distance==null;if(ag!==bg)return ag?1:-1;if(!ag&&Math.abs(a.distance-b.distance)>0.05)return a.distance-b.distance}return 0});return pool[0]}
function showPick(pick){if(!pick){recommendation.hidden=true;msg.textContent='I could not find a match for those choices yet. Try removing one refinement.';return}state.lastPick=pick;recommendation.hidden=false;document.getElementById('pickName').textContent=pick.name;const distance=pick.distance!=null?` • ${pick.distance.toFixed(1)} mi away`:'';document.getElementById('pickMeta').textContent=(pick.town||'SouthCoast')+distance+' • '+(state.service?state.service.replace('_',' '):'flexible service');document.getElementById('pickReason').textContent=state.food?'Fits what you’re craving.':'A SouthCoast option worth considering.'}
document.getElementById('find').onclick=()=>{if(!dataReady){msg.textContent='Still loading the restaurant database…';return}state.excluded=[];showPick(choose())};document.querySelectorAll('[data-refine]').forEach(b=>b.onclick=()=>{if(!state.lastPick)return;const action=b.dataset.refine;if(action==='different'||action==='another'){state.excluded=[...new Set([...state.excluded,state.lastPick.id])];showPick(choose(state.excluded));return}if(action==='closer'&&state.location==='current'){state.excluded=[...new Set([...state.excluded,state.lastPick.id])];showPick(choose(state.excluded));return}if(action==='cheaper'){const candidates=records.filter(r=>!state.excluded.includes(r.id)&&(!state.food||r.food.includes(normalizeFood(state.food)))&&(!state.service||r.services.includes(normalizeService(state.service)))&&(!state.town||r.town.toLowerCase()===state.town.toLowerCase())&&r.price!=null);candidates.sort((a,b)=>a.price-b.price);showPick(candidates[0]||null)}});document.getElementById('go').onclick=()=>{if(state.lastPick?.website)window.open(state.lastPick.website,'_blank','noopener');else msg.textContent='Restaurant website is not available yet.'};
</script></body></html>
