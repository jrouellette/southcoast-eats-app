<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SouthCoast Eats</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

<header class="header">
  <button class="menu" aria-label="Menu">☰</button>
  <img src="brand-logo.jpg" alt="SouthCoast Eats — Local Picks. Better Meals." class="logo">
  <button class="search" aria-label="Search">⌕</button>
</header>

<section class="intro">
  <h1>What sounds good?</h1>
  <p>Find great food around the SouthCoast.</p>
</section>

<main>
<section class="location">
  <button class="current" id="current">
    <span class="loc">➤</span>
    <span><b>Use my current location</b><small>Find what’s open near you</small></span>
    <i>›</i>
  </button>

  <button class="town-toggle" id="townToggle">
    <span class="pin">●</span>
    <b>Search near a town instead</b>
    <i>›</i>
  </button>

  <div class="towns" id="towns" hidden>
    <button>Fall River</button><button>New Bedford</button><button>Dartmouth</button><button>Somerset</button><button>Tiverton</button>
    <button>Westport</button><button>Swansea</button><button>Seekonk</button><button>Bristol</button>
  </div>
</section>

<section class="food">
<h2>I’m craving...</h2>
<div class="food-grid">
<button>🍕<b>Pizza</b></button><button>🍔<b>American</b></button><button>🦐<b>Seafood</b></button><button>🍝<b>Italian</b></button>
<button>🌮<b>Mexican</b></button><button>🥡<b>Asian</b></button><button>🍺<b>Pub/Burger</b></button><button>🔥<b>BBQ</b></button>
<button>🥞<b>Breakfast</b></button><button>☕<b>Coffee &amp; Treats</b></button><button>🥗<b>Healthy</b></button><button>🍰<b>Dessert</b></button>
</div>
<button class="surprise" id="surprise">⚄ &nbsp; Surprise Me</button>
</section>

<section class="how">
<h2>How do you want it?</h2>
<div class="how-grid"><button>🚗 <b>Pickup</b></button><button>🛵 <b>Delivery</b></button><button>🍴 <b>Dine In</b></button></div>
</section>

<button class="find" id="find">FIND MY TONIGHT'S PICK&nbsp; →</button>
<div class="msg" id="msg"></div>
</main>

<footer><img src="coastal-footer.jpg" alt="" class="footer-photo"></footer>
</div>

<script>
const msg=document.getElementById('msg');

document.getElementById('current').onclick=()=>{
  msg.textContent='Using your current location.';
};

document.getElementById('townToggle').onclick=()=>{
  const t=document.getElementById('towns');
  t.hidden=!t.hidden;
};

document.querySelectorAll('.towns button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.towns button').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel');
});

document.querySelectorAll('.food-grid button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.food-grid button').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel');
});

document.getElementById('surprise').onclick=()=>{
  const a=[...document.querySelectorAll('.food-grid button')];
  a.forEach(x=>x.classList.remove('sel'));
  a[Math.floor(Math.random()*a.length)].classList.add('sel');
};

document.querySelectorAll('.how-grid button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.how-grid button').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel');
});

document.getElementById('find').onclick=()=>{
  msg.textContent="Recommendation flow coming next.";
};
</script>
</body>
</html>
