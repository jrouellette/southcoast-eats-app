<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SouthCoast Eats</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="brand-header">
    <button class="header-button" aria-label="Open menu">☰</button>
    <div class="brand-lockup" aria-label="SouthCoast Eats — Local Picks. Better Meals.">
      <svg class="brand-mark" viewBox="0 0 220 92" role="img" aria-label="Wave and sun">
        <circle cx="72" cy="31" r="25" fill="#f6bd42"/>
        <path d="M25 48 Q70 18 112 43 T195 39" fill="none" stroke="#1497ad" stroke-width="18" stroke-linecap="round"/>
        <path d="M25 48 Q70 18 112 43 T195 39" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
        <path d="M25 62 Q70 38 112 57 T195 53" fill="none" stroke="#0b315d" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <div class="brand-name"><span>SouthCoast</span> <em>Eats</em></div>
      <div class="tagline">LOCAL PICKS. BETTER MEALS.</div>
    </div>
    <button class="header-button search" aria-label="Search">⌕</button>
  </header>

  <section class="hero">
    <img src="coastal-hero.jpg" alt="" class="hero-image">
    <div class="hero-copy">
      <h1>What sounds good?</h1>
      <p>Find great food around the SouthCoast.</p>
    </div>
  </section>

  <main>
    <section class="location">
      <button class="current" id="current"><span class="symbol">➤</span><span><strong>Use my current location</strong><small>Find what’s open near you</small></span><b>›</b></button>
      <button class="town-toggle" id="town-toggle" aria-expanded="true"><span class="symbol pin">●</span><strong>Search near a town instead</strong><b>›</b></button>
      <div class="towns" id="towns">
        <button>Fall River</button><button>New Bedford</button><button>Dartmouth</button><button>Somerset</button><button>Tiverton</button><button>Westport</button><button>Swansea</button><button>Seekonk</button><button>Bristol</button>
      </div>
    </section>

    <section class="food">
      <h2>I’m craving...</h2>
      <div class="food-grid">
        <button class="food-card">🍕<strong>Pizza</strong></button><button class="food-card">🍔<strong>American</strong></button><button class="food-card">🦐<strong>Seafood</strong></button><button class="food-card">🍝<strong>Italian</strong></button>
        <button class="food-card">🌮<strong>Mexican</strong></button><button class="food-card">🥡<strong>Asian</strong></button><button class="food-card">🍺<strong>Pub/Burger</strong></button><button class="food-card">🔥<strong>BBQ</strong></button>
        <button class="food-card">🥞<strong>Breakfast</strong></button><button class="food-card">☕<strong>Coffee &amp; Treats</strong></button><button class="food-card">🥗<strong>Healthy</strong></button><button class="food-card">🍰<strong>Dessert</strong></button>
      </div>
      <button class="surprise" id="surprise">⚄ &nbsp; Surprise Me</button>
    </section>

    <section class="how">
      <h2>How do you want it?</h2>
      <div class="how-grid"><button class="how-card selected">🚗 <strong>Pickup</strong></button><button class="how-card">🛵 <strong>Delivery</strong></button><button class="how-card">🍴 <strong>Dine In</strong></button></div>
    </section>

    <button class="find" id="find">FIND MY TONIGHT'S PICK&nbsp; →</button>
    <div class="message" id="message" aria-live="polite"></div>
  </main>

  <footer><div class="waves"></div><div class="footer-copy">⚓<br>FALL RIVER • NEW BEDFORD • SOMERSET • TIVERTON<br>DARTMOUTH • SEEKONK • SWANSEA • WESTPORT • BRISTOL</div></footer>
</div>
<script>
const $ = id => document.getElementById(id);
$('town-toggle').addEventListener('click',()=>{ $('towns').hidden=!$('towns').hidden; $('town-toggle').setAttribute('aria-expanded',String(!$('towns').hidden)); });
$('current').addEventListener('click',()=> $('message').textContent='Using your current location.');
document.querySelectorAll('.towns button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.towns button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');}));
document.querySelectorAll('.food-card').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.food-card').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');}));
$('surprise').addEventListener('click',()=>{const a=[...document.querySelectorAll('.food-card')];a.forEach(x=>x.classList.remove('selected'));a[Math.floor(Math.random()*a.length)].classList.add('selected');});
document.querySelectorAll('.how-card').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.how-card').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');}));
$('find').addEventListener('click',()=> $('message').textContent="Recommendation flow coming next.");
</script>
</body>
</html>
